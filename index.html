<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaPlacePoker</title>
  
  <!-- Polices Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- CSS de Leaflet et MarkerCluster -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">

  <!-- Lien vers TON fichier CSS -->
  <link rel="stylesheet" href="styles.css">

  <link rel="icon" type="image/ico" href="assets/img/icon.ico">

</head>
<body>
  <!-- En-tête de la page -->
  <header>
    <div class="header-titre">
      <img src="assets/img/Logo_Transp_Blanc.png" alt="Logo LaPlacePoker" class="logo-site">
      <div class="titre-textes">
        <h1>LaPlacePoker</h1>
        <p>Tournois en bars, casinos, tournois associatif : tout au même endroit.</p>
      </div>
    </div>

    <div class="header-actions">
      <button type="button" id="btn-proposer" class="btn-proposer">Proposer un tournoi associatif</button>

      <div class="menu-dropdown">
        <button type="button" class="btn-burger" id="btn-burger" onclick="toggleMenu(event)" aria-label="Menu navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="dropdown-content" id="dropdown-content">
          <a href="contact.html">À propos & Contact</a>
          <a href="mentions-legales.html">Mentions légales</a>
          <a href="politique-confidentialite.html">Politique de confidentialité</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenu principal -->
  <main>
    <!-- Panneau latéral avec les filtres et la liste -->
    <aside>
      <div class="filters">
        <label>Type de lieu
          <select id="f-type">
            <option value="">Tous les types</option>
            <option value="bar">Red Cactus</option>
            <option value="casino">Casinos</option>
            <option value="associatif">Associatif</option>
          </select>
          </select>
        </label>
        <label>Tarif
          <select id="f-prix">
            <option value="">Gratuit et payant</option>
            <option value="gratuit">Gratuit</option>
            <option value="payant">Payant</option>
          </select>
        </label>
        <label> Format
        <select id="f-poker">
          <option value="">Tous les formats</option>
          <option value="cash">Cash Game</option>
          <option value="tournois">Tournois</option>
          <option value="les_deux">Cash Game & Tournois</option>
        </select>
      </label>
      </div>
      
      <!-- Compteur de résultats -->
      <div id="count" aria-live="polite"></div>
      
      <!-- Liste des cartes des bars -->
      <div id="list"></div>
    </aside>
    
    <!-- Conteneur de la carte -->
    <div id="map" role="region" aria-label="Carte des lieux"></div>
  </main>

  <!-- Pied de page -->
  <!-- <footer>Interdit aux mineurs. Jouer comporte des risques...</footer> -->

  <!-- Fenêtre qui affiche le formulaire pour les organisateurs de tournois caritatifs -->
  <dialog id="dlg-tournoi" aria-labelledby="dlg-titre">
    <div class="dlg-barre">
      <h2 id="dlg-titre">Proposer un tournoi associatif</h2>
      <button type="button" id="dlg-close">Fermer</button>
    </div>
    <div class="dlg-corps">
      <p id="dlg-msg" hidden>Le formulaire n'est pas encore configuré.</p>
      <iframe id="dlg-frame" title="Formulaire pour proposer un tournoi associatif" hidden></iframe>
      <a id="dlg-lien" href="#" target="_blank" rel="noopener noreferrer" hidden>Ouvrir le formulaire dans un nouvel onglet</a>
    </div>
  </dialog>

  <!-- Scripts externes Leaflet et MarkerCluster -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

  <!-- Lien vers TON fichier JavaScript -->
  <script src="app.js"></script>
</body>
</html>
